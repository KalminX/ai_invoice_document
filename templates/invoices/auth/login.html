{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - AI Invoice & Document Extraction Pipeline</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top right, #1e293b, #0f172a);
      padding: 20px;
    }
    .login-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
    }
    .login-header {
      padding: 32px 32px 24px;
      text-align: center;
      background-color: #f8fafc;
      border-bottom: 1px solid var(--border-color);
    }
    .login-logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }
    .login-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
    }
    .login-subtitle {
      font-size: 0.82rem;
      color: #64748b;
      margin-top: 4px;
    }
    .login-body {
      padding: 32px;
    }
    .demo-users-box {
      margin-top: 24px;
      padding: 16px;
      border-radius: var(--radius);
      background-color: #f8fafc;
      border: 1px dashed #cbd5e1;
    }
    .demo-users-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #475569;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .demo-user-btn {
      width: 100%;
      text-align: left;
      padding: 8px 12px;
      font-size: 0.78rem;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      margin-bottom: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
    }
    .demo-user-btn:hover {
      border-color: #3b82f6;
      background-color: #eff6ff;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">⚡</div>
        <h2 class="login-title">DocExtract AI</h2>
        <p class="login-subtitle">Enterprise Invoice & Document Extraction Pipeline</p>
      </div>

      <div class="login-body">
        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-{{ message.tags }}" style="margin-bottom: 16px;">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'invoices:login' %}">
          {% csrf_token %}
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" required placeholder="Enter username" autofocus>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; margin-top: 8px;">
            Sign In to Workspace
          </button>
        </form>

        <div class="demo-users-box">
          <div class="demo-users-title">
            <span>⚡ Demo Personas (1-Click Auto Fill)</span>
          </div>
          <button type="button" class="demo-user-btn" onclick="fillCredentials('admin', 'admin12345')">
            <div>
              <strong>Sarah Chen</strong> <span style="color: #64748b;">(Finance Director)</span>
            </div>
            <span style="font-size: 0.72rem; color: #2563eb; font-weight: 600;">admin</span>
          </button>
          <button type="button" class="demo-user-btn" onclick="fillCredentials('reviewer', 'finance12345')">
            <div>
              <strong>Alex Rivera</strong> <span style="color: #64748b;">(AP Specialist)</span>
            </div>
            <span style="font-size: 0.72rem; color: #2563eb; font-weight: 600;">reviewer</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    function fillCredentials(user, pass) {
      document.getElementById('username').value = user;
      document.getElementById('password').value = pass;
      if (window.gsap) {
        gsap.fromTo('#username, #password', { backgroundColor: '#eff6ff' }, { backgroundColor: '#ffffff', duration: 0.6 });
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.gsap) {
        gsap.from('.login-card', {
          y: 24,
          opacity: 0,
          duration: 0.7,
          ease: 'power3.out'
        });
        gsap.from('.login-logo', {
          scale: 0.6,
          rotation: -10,
          opacity: 0,
          duration: 0.6,
          delay: 0.2,
          ease: 'back.out(1.7)'
        });
        gsap.from('.demo-user-btn', {
          y: 12,
          opacity: 0,
          duration: 0.4,
          stagger: 0.1,
          delay: 0.4,
          ease: 'power2.out'
        });
      }
    });
  </script>
</body>
</html>
